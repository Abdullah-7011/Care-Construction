name: Extract zip and force-add ignored files

on:
  push:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and commit all files
        run: |
          if [ ! -f care-construction.zip ]; then echo "No zip file found"; exit 0; fi
          unzip -l care-construction.zip
          unzip -o -q care-construction.zip
          rm care-construction.zip
          cp -a care-construction/. .
          rm -rf care-construction
          rm -f .github/workflows/list-zip.yml
          git status --short || true
          git ls-files --others --ignored --exclude-standard || true
          git add -A
          git add -f -A
          git status --short || true
          git config user.name "Abdullah-7011"
          git config user.email "abdullah-7011@users.noreply.github.com"
          git commit -m "Add remaining project files from zip" || echo "Nothing to commit"
          git push
