name: Extract uploaded zip

on:
  push:
    paths:
      - 'care-construction.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and commit contents
        run: |
          if [ ! -f care-construction.zip ]; then echo "No zip file found"; exit 0; fi
          unzip -o care-construction.zip
          rm care-construction.zip
          shopt -s dotglob
          mv care-construction/* .
          rmdir care-construction || true
          rm -f .github/workflows/extract-zip.yml
          git config user.name "Abdullah-7011"
          git config user.email "abdullah-7011@users.noreply.github.com"
          git add -A
          git commit -m "Add Care Construction Flutter source files" || echo "Nothing to commit"
          git push
